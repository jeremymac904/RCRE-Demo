services:
  postgres:
    image: postgres:16-alpine
    container_name: rcre-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rcre_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_only_postgres_password
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - rcre_pg_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rcre_local"]
      interval: 3s
      timeout: 2s
      retries: 20

volumes:
  rcre_pg_data:
