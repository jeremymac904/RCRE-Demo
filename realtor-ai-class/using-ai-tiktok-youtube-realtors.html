op:0;left:0;width:100%;appearance:none;border:0;background:#302d29}.progress::-webkit-progress-bar{background:#302d29}.progress::-webkit-progress-value{background:var(--orange)}.progress::-moz-progress-bar{background:var(--orange)}dialog{background:#20201f;color:var(--paper);border:1px solid #77716a;border-radius:9px;width:min(940px,94vw);max-height:88svh;padding:0;box-shadow:0 30px 100px #000b}dialog::backdrop{background:#000b}dialog header{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}dialog h2{font-size:27px;letter-spacing:-.5px;margin:0}dialog .panel-body{padding:24px 28px;max-height:calc(88svh - 95px);overflow:auto;font-size:20px;line-height:1.55}.panel-body pre{white-space:pre-wrap;font-family:inherit;margin:18px 0;overflow-wrap:anywhere;font-size:21px}.panel-body p{margin:0 0 18px}.panel-body h3{font-size:21px;color:var(--orange);margin:22px 0 8px}.panel-body textarea{width:100%;min-height:170px;padding:12px;background:#111;color:white;line-height:1.5;font-size:18px}.panel-body .status{color:#e9b18a;font-size:16px;margin:12px 0}.note-warning{border-left:4px solid var(--orange);padding:12px 16px;background:#34302c;font-weight:700}.overview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.overview-grid button{text-align:left;min-height:95px;line-height:1.35}.overview-grid span{display:block;color:var(--orange);margin-bottom:7px}.overview-grid button[aria-current=true]{border:2px solid var(--orange)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

<script>
const DATA={"slides": [{"section": "RCRE REALTOR CLASS", "title": "Using AI to Help Build Your TikTok &amp; YouTube Channel", "body": "<p class=\"hero-sub\">One buyer question.<br>A week of useful content.<\/p><div class=\"brand\"><strong>Jeremy McDonald<\/strong><br>The Legends Mortgage Team<br><span>powered by Loan Factory<\/span><\/div><p class=\"date\">September 9, 2026 &nbsp; / &nbsp; 11 AM to noon Eastern<\/p>", "time": "11:00 to 11:01 · 1 minute", "say": "By the time we finish, I want you to have one video you can record and a process you can repeat next week. AI helps organize the experience you already have.", "key": "Set a practical expectation.", "transition": "Show the three things participants will leave with.", "kind": "cover", "question": "", "demo": null, "steps": "", "refs": []}, {"section": "01 / THE OUTCOME", "title": "Your takeaways today", "body": "<div class=\"cols\"><div><h3>A clear audience<\/h3><p>Who your channel helps and the question they need answered.<\/p><\/div><div><h3>A usable script<\/h3><p>One short video you can read aloud, review, and record.<\/p><\/div><div><h3>A weekly process<\/h3><p>A manageable plan with one improvement to test next time.<\/p><\/div><\/div>", "time": "11:01 to 11:02 · 1 minute", "say": "Keep these three deliverables in a note beside you. We will build each one during the class.", "key": "Success is a usable output.", "transition": "Ask for a real buyer question.", "kind": "", "question": "", "demo": null, "steps": "", "refs": []}, {"section": "01 / THE OUTCOME", "title": "What do buyers keep asking you?", "body": "<blockquote>“What should I do before touring my first home?”<\/blockquote><p class=\"lead\">Put one question in the chat.<\/p><p class=\"muted\">Share the question only. Leave out names and personal details.<\/p>", "time": "11:02 to 11:04 · 2 minutes", "say": "Give the room a quiet moment to respond. Pick one question we can answer clearly. If the room is quiet, use the touring question shown here.", "key": "Start with a conversation the audience recognizes.", "transition": "Show how one question moves through the whole workflow.", "kind": "question", "question": "What buyer question did you hear recently?", "demo": null, "steps": "", "refs": []}, {"section": "01 / THE OUTCOME", "title": "The complete content workflow", "body": "<ol class=\"workflow\"><li><span>01<\/span>Choose an audience<\/li><li><span>02<\/span>Collect buyer questions<\/li><li><span>03<\/span>Validate the topic<\/li><li><span>04<\/span>Write and improve<\/li><li><span>05<\/span>Expand for YouTube<\/li><li><span>06<\/span>Create title and thumbnail<\/li><li><span>07<\/span>Plan the week<\/li><li><span>08<\/span>Review and improve<\/li><\/ol>", "time": "11:04 to 11:05 · 1 minute", "say": "We will follow one question through all eight steps. Research and human review stay in the process.", "key": "One question can support several complete explanations.", "transition": "Choose a specific audience.", "kind": "", "question": "", "demo": null, "steps": "", "refs": []}, {"section": "02 / AUDIENCE", "title": "A person, a place, a problem", "body": "<p class=\"eyebrow\">HYPOTHETICAL CLASSROOM EXAMPLE<\/p><blockquote>First time buyers in Northeast Florida who feel overwhelmed about where to begin.<\/blockquote><div class=\"cols\"><div><h3>Content promise<\/h3><p>Help them understand their next step before touring.<\/p><\/div><div><h3>Next conversation<\/h3><p>A buyer consultation to plan those first steps.<\/p><\/div><\/div>", "time": "11:05 to 11:07 · 2 minutes", "say": "This audience is a teaching choice, not measured local demand. Define the situation and the problem without inventing demographic traits.", "key": "Specific context guides useful drafts.", "transition": "Compare two prompts.", "kind": "", "question": "", "demo": null, "steps": "", "refs": []}, {"section": "02 / AUDIENCE", "title": "A vague prompt and a useful prompt", "body": "<div class=\"compare\"><div><p class=\"eyebrow\">VAGUE<\/p><h3>“Write a real estate post.”<\/h3><p>AI has to guess the audience and purpose.<\/p><\/div><div><p class=\"eyebrow\">USEFUL<\/p><h3>“Help a first time buyer understand what to do before touring homes.”<\/h3><p>Add your place, tone, output, and factual limits.<\/p><\/div><\/div>", "time": "11:07 to 11:09 · 2 minutes", "say": "The useful prompt supplies a person, a problem, and an outcome. The full demo adds the deliverables and guardrails.", "key": "Prompt quality starts with context.", "transition": "Run the audience and content pillar prompt.", "kind": "", "question": "", "demo": null, "steps": "", "refs": []}, {"section": "02 / LIVE DEMO 1", "title": "Your audience and content pillars", "body": "<p class=\"lead\">Build a channel promise and nine specific video ideas.<\/p><div class=\"demo-line\"><span>PASTE<\/span><p>Open the full prompt. Add your context, then run it in your AI chat.<\/p><\/div><div class=\"demo-line\"><span>NOTICE<\/span><p>Which idea sounds like a conversation you actually had? These are ideas to validate.<\/p><\/div>", "time": "11:09 to 11:12 · 3 minutes", "say": "Open the prompt and run it in your AI chat. Scan the channel promise and one idea per pillar. If the response is slow, open the prepared example.", "key": "AI organizes possibilities. You choose what fits.", "transition": "Collect evidence for one question.", "kind": "", "question": "Which idea sounds like a real buyer conversation?", "demo": "audience", "steps": "Copy the prompt. Paste into a clean AI chat. Run it. Read the promise and one idea per pillar. Ask the room to choose.", "refs": []}, {"section": "03 / RESEARCH", "title": "Research signals and AI guesses", "body": "<div class=\"compare\"><div><p class=\"eyebrow\">OBSERVED EVIDENCE<\/p><ul><li>An anonymous question a client asked<\/li><li>A search suggestion you actually saw<\/li><li>A relevant unanswered comment<\/li><\/ul><\/div><div><p class=\"eyebrow\">JUDGMENT TO TEST<\/p><ul><li>An AI generated topic list<\/li><li>“This might make a useful video”<\/li><li>“This probably matters locally”<\/li><\/ul><\/div><\/div><p class=\"bottom-line\">Record the source and date. A signal does not establish local demand or exact search volume.<\/p>", "time": "11:12 to 11:16 · 4 minutes", "say": "AI can suggest a hundred topics without proving anyone searches for them. Capture the exact observation and label your interpretation separately. Avoid copying personal information from comments.", "key": "Evidence and judgment belong in separate fields.", "transition": "Demonstrate one research observation.", "kind": "", "question": "", "demo": null, "steps": "", "refs": []}, {"section": "03 / LIVE DEMO 2", "title": "One buyer question worth answering", "body": "<p class=\"lead\">Observe one audience signal, then rank three candidate questions.<\/p><div class=\"demo-line\"><span>PASTE<\/span><p>Open the full prompt. Add your context, then run it in your AI chat.<\/p><\/div><div class=\"demo-line\"><span>NOTICE<\/span><p>The output must cite supplied observations or label a topic unvalidated.<\/p><\/div><p class=\"muted\">Research limit: one example. If loading takes a minute, use an anonymous question from the room.<\/p>", "time": "11:16 to 11:22 · 6 minutes", "say": "If available, show TikTok Creator Search Insights and its Content gap filter. Otherwise inspect one relevant YouTube search suggestion or comment, or use the room’s question. Record only what you see. The prepared ranking contains no invented evidence.", "key": "A useful topic can remain unvalidated until evidence arrives.", "transition": "Write the answer to the touring question.", "kind": "", "question": "", "demo": "research", "steps": "Collect one observation with source and date. Open the prompt. Replace the observation placeholder with that evidence and candidate questions. Run it. Compare the ranked judgment with the evidence column. Use the prepared example if needed.", "refs": [["TikTok Creator Search Insights", "https://newsroom.tiktok.com/creator-search-insights?lang=en"], ["TikTok help", "https://support.tiktok.com/en/using-tiktok/growing-your-audience/creator-search-insights"]]}, {"section": "04 / THE SHORT VIDEO", "title": "A simple script structure", "body": "<ol class=\"framework\"><li><b>01<\/b><div><h3>Hook<\/h3><p>Name the buyer’s concern.<\/p><\/div><\/li><li><b>02<\/b><div><h3>Answer<\/h3><p>Give the useful steps immediately.<\/p><\/div><\/li><li><b>03<\/b><div><h3>Example<\/h3><p>Make one detail easy to picture.<\/p><\/div><\/li><li><b>04<\/b><div><h3>Next step<\/h3><p>Offer one relevant invitation.<\/p><\/div><\/li><\/ol>", "time": "11:22 to 11:24 · 2 minutes", "say": "Use four parts. The hook introduces the concern, and the answer follows without a long biography. The example makes it concrete. End with one natural invitation.", "key": "A short video should give a complete answer.", "transition": "Generate the first script.", "kind": "", "question": "", "demo": null, "steps": "", "refs": []}, {"section": "04 / LIVE DEMO 3", "title": "The first script draft", "body": "<p class=\"lead\">Answer: “What should I do before touring my first home?”<\/p><div class=\"demo-line\"><span>PASTE<\/span><p>Open the full prompt. Add your context, then run it in your AI chat.<\/p><\/div><div class=\"demo-line\"><span>NOTICE<\/span><p>Budget, a financing conversation, and priorities. Spoken words should be separate from filming notes.<\/p><\/div><p class=\"muted\">Target: 45 to 60 seconds. Read aloud to check the real duration.<\/p>", "time": "11:24 to 11:28 · 4 minutes", "say": "Run the script prompt. Identify the hook and the example. This length is a teaching target, not a TikTok or YouTube rule. Do not treat an AI estimate as the actual running time.", "key": "A draft gives you something concrete to improve.", "transition": "Read the prepared script aloud.", "kind": "", "question": "", "demo": "script", "steps": "Copy and run the full script prompt. Check the three steps and forbidden claims. Read the opening aloud. Open the prepared example if the response is slow.", "refs": []}, {"section": "04 / PREPARED EXAMPLE", "title": "A script you can record", "body": "<div class=\"script-copy\"><p>Before you spend Saturday touring homes, I’d get clear on three things.<\/p><p>First, what monthly housing payment actually feels comfortable for you? Think about your whole budget, including room for repairs and the life you want to live.<\/p><p>Second, talk with a mortgage professional about your financing and what documents they need.<\/p><p>Third, separate your must haves from your nice to haves.<\/p><p>A shorter commute might be essential. The perfect kitchen backsplash probably isn’t.<\/p><p>When we get clear on those things first, I can help you focus your search.<\/p><p>If you’re buying your first home and don’t know where to start, message me and we’ll map out your first steps.<\/p><\/div>", "time": "11:28 to 11:30 · 2 minutes", "say": "Read this aloud at a natural pace and pause between the steps. The commute and backsplash comparison is a hypothetical illustration, not a client story. Remove any phrase you would not say.", "key": "Useful details can sound conversational.", "transition": "Let participants improve the draft.", "kind": "script", "question": "", "demo": null, "steps": "", "refs": []}, {"section": "04 / YOUR TURN", "title": "The read aloud edit", "body": "<p class=\"lead\">Read your opening to a partner or quietly to yourself.<\/p><div class=\"cols\"><div><h3>Cut<\/h3><p>Remove one phrase you would never say to a buyer.<\/p><\/div><div><h3>Clarify<\/h3><p>Replace one vague sentence with a concrete detail.<\/p><\/div><div><h3>Keep<\/h3><p>Preserve the answer and one useful next step.<\/p><\/div><\/div><p class=\"bottom-line\">Then ask AI for a revision without new factual claims.<\/p>", "time": "11:30 to 11:34 · 4 minutes", "say": "Allow two minutes to read and mark a phrase, then one minute to run the revision prompt and compare. Finish by asking whether the revised script still gives the same answer.", "key": "Your voice and judgment make the draft usable.", "transition": "Expand the approved script for YouTube.", "kind": "", "question": "Which phrase did you cut, and why?", "demo": "revise", "steps": "Read aloud. Mark filler or awkward phrasing. Run the revision prompt in the same chat, or paste the draft into a new chat. Compare facts before and after.", "refs": []}, {"section": "05 / LIVE DEMO 4", "title": "A longer explanation for YouTube", "body": "<p class=\"lead\">Expand the approved script into a 5 to 7 minute explanation.<\/p><div class=\"demo-line\"><span>PASTE<\/span><p>Open the full prompt. Add your context, then run it in your AI chat.<\/p><\/div><div class=\"demo-line\"><span>NOTICE<\/span><p>Each section adds a practical example. The title, thumbnail, and opening make the same promise.<\/p><\/div><div class=\"inline-sequence\"><span>Budget<\/span><span>Financing conversation<\/span><span>Focused home search<\/span><\/div>", "time": "11:34 to 11:38 · 4 minutes", "say": "Paste the reviewed short script into the prompt. This is our teaching format, not a platform requirement. Look for examples rather than repeated points. The prepared result includes a six minute outline and titles.", "key": "Longer content earns its length with explanation.", "transition": "Inspect the timing of the expanded outline.", "kind": "", "question": "", "demo": "youtube", "steps": "Open prompt. Replace the approved script placeholder. Run it. Check the examples and claims needing review. Use the prepared outline if needed.", "refs": []}, {"section": "05 / PREPARED EXAMPLE", "title": "Six minutes with a clear purpose", "body": "<div class=\"timeline\"><div><span>0:00 to 0:20<\/span><h3>The buyer’s question<\/h3><p>Explain what to do before touring.<\/p><\/div><div><span>0:20 to 1:50<\/span><h3>A comfortable budget<\/h3><p>Hypothetical example: leave room for everyday life.<\/p><\/div><div><span>1:50 to 3:20<\/span><h3>The financing conversation<\/h3><p>Prepare questions for the mortgage professional.<\/p><\/div><div><span>3:20 to 5:20<\/span><h3>A focused search<\/h3><p>Hypothetical example: commute and backsplash.<\/p><\/div><div><span>5:20 to 6:00<\/span><h3>Recap and invitation<\/h3><p>Plan your first steps in a buyer consultation.<\/p><\/div><\/div>", "time": "11:38 to 11:41 · 3 minutes", "say": "Walk through the outline. A useful example fills each section. Record a rehearsal to check timing. If it is repetitive, shorten it instead of stretching it.", "key": "Each section earns its place.", "transition": "Match the packaging to the explanation.", "kind": "", "question": "", "demo": null, "steps": "", "refs": []}, {"section": "05 / TITLE AND THUMBNAIL", "title": "One promise across the package", "body": "<div class=\"package\"><div><p class=\"eyebrow\">PREPARED TITLE<\/p><h3>Buying Your First Home?<br>Start With These 3 Steps<\/h3><p>The opening delivers the same three steps.<\/p><\/div><div class=\"thumbnail\"><p>BEFORE<br>YOU TOUR<\/p><span>Budget<br>Financing<br>Priorities<\/span><\/div><\/div><p class=\"muted\">Thumbnail concept: your own photo beside a simple checklist. Keep the words readable.<\/p>", "time": "11:41 to 11:44 · 3 minutes", "say": "YouTube advises accurate, succinct titles with important words early. Show the text concept. If using a thumbnail editor, limit it to two minutes and use a photo you have permission to use.", "key": "The title and thumbnail should accurately preview the answer.", "transition": "Repurpose the idea into a week of complete answers.", "kind": "", "question": "If you clicked this title, what would you expect the video to explain?", "demo": null, "steps": "", "refs": [["YouTube title and thumbnail guidance", "https://support.google.com/youtube/answer/12340300?hl=en"]]}, {"section": "06 / LIVE DEMO 5", "title": "A week of related answers", "body": "<p class=\"lead\">Plan three distinct short videos and one longer explanation.<\/p><div class=\"demo-line\"><span>PASTE<\/span><p>Open the full prompt. Add your context, then run it in your AI chat.<\/p><\/div><div class=\"demo-line\"><span>NOTICE<\/span><p>Each short stands alone. The plan must not claim anything has been reviewed or published.<\/p><\/div><p class=\"muted\">Open the prepared example for hooks, takeaways, filming needs, review needs, and tracking fields.<\/p>", "time": "11:44 to 11:47 · 3 minutes", "say": "Use the approved topic and script as inputs. Check that each short answers a different question. If four videos exceed available time, start with one short.", "key": "Repurposing preserves usefulness in each piece.", "transition": "Put production time beside publishing days.", "kind": "", "question": "", "demo": "week", "steps": "Open prompt and add the reviewed material. Run it. Compare the three short questions. Inspect review flags and status fields. Open the prepared plan if needed.", "refs": []}, {"section": "06 / THE WEEKLY CALENDAR", "title": "A realistic first content week", "body": "<div class=\"calendar\"><div><span>MON<\/span><h3>Short 1<\/h3><p>A comfortable housing budget<\/p><\/div><div><span>WED<\/span><h3>Short 2<\/h3><p>Questions for the financing conversation<\/p><\/div><div><span>FRI<\/span><h3>Short 3<\/h3><p>Must haves and preferences<\/p><\/div><div><span>SUN<\/span><h3>YouTube<\/h3><p>The full process with examples<\/p><\/div><\/div><p class=\"bottom-line\">Before Monday: plan and review, then batch record. Reserve a separate edit session.<\/p><p class=\"muted\">Proposed calendar. Start with one short if that is what your week allows.<\/p>", "time": "11:47 to 11:49 · 2 minutes", "say": "These are example publishing days, not a claim about ideal posting times. Planning, recording, and editing need time before publication. Start smaller when necessary.", "key": "A calendar must fit your real capacity.", "transition": "Show the review and tracking process.", "kind": "", "question": "", "demo": null, "steps": "", "refs": []}, {"section": "06 / HUMAN REVIEW", "title": "The review comes before recording", "body": "<div class=\"compare\"><div><p class=\"eyebrow\">BEFORE RECORDING<\/p><ul><li>Check accuracy and your own voice.<\/li><li>Deliver the promised takeaway.<\/li><li>Remove private details.<\/li><li>Verify financing details with your mortgage partner.<\/li><\/ul><\/div><div><p class=\"eyebrow\">ONE ROW PER VIDEO<\/p><p>Topic, draft status, review status, recording status, publish date, video link, seven day results, next improvement.<\/p><p class=\"muted\">Keep proposed dates separate from actual publishing.<\/p><\/div><\/div>", "time": "11:49 to 11:51 · 2 minutes", "say": "Use a simple spreadsheet or document with one row per video. The prepared weekly result has all the fields. Never advance a status because AI says it is complete.", "key": "Humans verify facts and confirm real status.", "transition": "Choose what to learn from performance.", "kind": "", "question": "", "demo": null, "steps": "", "refs": []}, {"section": "06 / RESULTS", "title": "What will you improve next time?", "body": "<div class=\"cols\"><div><h3>Viewing behavior<\/h3><p>Where do people stop watching? Look for a part to clarify or shorten.<\/p><\/div><div><h3>Useful responses<\/h3><p>Which comments or questions reveal confusion or a next topic?<\/p><\/div><div><h3>Buyer conversations<\/h3><p>How many relevant conversations or consultation requests followed?<\/p><\/div><\/div><p class=\"bottom-line\">Review after seven days. Compare similar formats and observation windows. Change one thing.<\/p><p class=\"muted\">Small samples are clues. Views alone do not prove business impact.<\/p>", "time": "11:51 to 11:53 · 2 minutes", "say": "Record the observation window. Compare shorts with shorts and longer videos with similar longer videos. Use available viewing data, useful questions, and conversations. Missing analytics stay blank. Avoid guaranteed formulas.", "key": "Results help choose a specific next improvement.", "transition": "Protect the final seven minutes for the assignment and questions.", "kind": "", "question": "", "demo": null, "steps": "", "refs": [["YouTube audience retention", "https://support.google.com/youtube/answer/9314415?hl=en"], ["YouTube discovery guidance", "https://support.google.com/youtube/answer/141805?hl=en"]]}, {"section": "07 / QUESTIONS AND COMMITMENT", "title": "One useful video within 24 hours", "body": "<p class=\"hero-sub\">Choose one buyer question.<br>Finish one reviewed script.<br>Record your answer.<\/p><p class=\"lead\">What will you record first?<\/p><p class=\"muted\">Questions now. Your next buyer question becomes the next video.<\/p><button class=\"resource-trigger\" data-resources>Official resources<\/button>", "time": "11:53 to noon · 7 minutes", "say": "Use the first two minutes for commitments and the final five for questions. Equipment: start with a phone, clear audio, and good light. AI drafts and organizes, while you review. Answer the question before inviting a next step. If someone dislikes being on camera, suggest a narrated checklist using material they have permission to share. Finish at noon.", "key": "A completed useful video is the first assignment.", "transition": "Close the class and invite participants to repeat the process.", "kind": "closing", "question": "Which buyer question will you turn into a video within 24 hours?", "demo": null, "steps": "", "refs": []}], "prompts": {"audience": "Act as my real estate content planning assistant.\n\nFor this classroom example, I am an RCRE Realtor serving first time buyers in Northeast Florida.\n\nMy audience feels overwhelmed about where to start. My goal is to earn trust and start buyer consultation conversations.\n\nCreate:\n1. One clear sentence describing who my channel helps.\n2. Three content pillars based on practical buyer questions.\n3. Nine specific video ideas, three per pillar.\n4. One natural call to action for each pillar.\n\nUse plain, conversational language. Avoid generic motivation, invented statistics, promises of results, and assumptions about personal demographics.\n\nTreat these as topic ideas to validate, not proven search trends.", "research": "Help me prioritize video topics for first time buyers in Northeast Florida.\n\nUse the buyer questions and research observations I paste next. Do not invent search volume, trends, comments, or local statistics.\n\nFor each topic, show:\n1. The buyer’s underlying concern.\n2. The evidence supporting the topic.\n3. Whether it fits a short video, a longer YouTube video, or both.\n4. How it could lead naturally to a buyer consultation.\n\nRank the top three using relevance, clarity, and usefulness to a buyer.\n\nKeep observed evidence separate from your judgment. If evidence is missing, label the topic unvalidated.\n\nHere are my questions and observations:\n[Paste anonymous observations with source and date here. If none are available, say: No observed evidence yet.]", "script": "Write a 45 to 60 second video script answering:\n“What should I do before touring my first home?”\n\nI am a Realtor speaking to a first time buyer in Northeast Florida.\n\nCover three practical steps:\n1. Choose a monthly housing budget that feels comfortable.\n2. Speak with a mortgage professional about financing and the documents needed.\n3. Separate must have features from preferences.\n\nOpen with the buyer’s concern. Give the answer immediately. Include one simple example and one invitation to message me to plan their first steps.\n\nWrite in first person, using short sentences that sound natural aloud.\n\nDo not invent client stories, loan requirements, rates, savings, approval promises, or local statistics. Do not include a long introduction.\n\nReturn the spoken script separately from filming notes.", "revise": "Revise the script I just generated.\n\nMake it sound like a real conversation with a buyer. Remove filler, repeated points, and phrases that sound like advertising.\n\nKeep the useful details and one clear next step. Do not add new factual claims.\n\nReturn only the revised spoken script.\n\nIf this is a new chat, use this draft:\n[Paste your script here.]", "youtube": "Use our approved short video as the foundation for a 5 to 7 minute YouTube video for first time buyers.\n\nCreate:\n1. Three clear, accurate title options.\n2. A 20 second opening that immediately addresses the buyer’s question.\n3. A timed outline with three main sections.\n4. One practical example per section, labeled hypothetical where appropriate.\n5. One thumbnail concept with no more than four words.\n6. One natural invitation to book a buyer consultation.\n\nExpand the explanation without adding filler or unsupported claims. Identify any factual statements that need verification before recording.\n\nKeep the title, thumbnail, and opening focused on the same promise.\n\nApproved script:\n[Paste your reviewed short script here.]", "week": "Turn our approved first time buyer topic into a manageable one week content plan.\n\nCreate three short videos and one longer YouTube video.\n\nEach short video must answer a different question and make sense on its own. The longer video should bring the process together with examples.\n\nFor each item, include:\n1. Topic and opening hook.\n2. Main takeaway.\n3. Call to action.\n4. What I need to record.\n5. Any facts requiring verification.\n\nAlso create a simple tracking table with:\nTopic, draft status, review status, recording status, publish date, video link, seven day results, and next improvement.\n\nUse the workflow:\nIdea, draft, human review, record, publish, review results.\n\nDo not claim anything has been reviewed, recorded, scheduled, or published.\n\nApproved topic and script:\n[Paste your reviewed material here.]\n\nKeep the production workload realistic. Suggest a smaller starting plan if four videos exceed my available time."}, "results": {"audience": "PREPARED EXAMPLE. Ideas to validate, not audience research.\n\nChannel promise\nI help first time buyers in Northeast Florida understand their next step before they start touring homes.\n\nPillar 1: Getting ready\n1. What should I do before touring my first home?\n2. How do I choose a comfortable housing budget?\n3. What should I ask a mortgage professional?\nInvitation: Message me to plan your first steps.\n\nPillar 2: Touring with a purpose\n4. How do I separate must haves from preferences?\n5. What questions should I bring to a home tour?\n6. How do I compare the homes I have seen?\nInvitation: Let’s build your home search checklist.\n\nPillar 3: Understanding the process\n7. What happens after an offer is accepted?\n8. What costs should I ask about beyond the down payment?\n9. Who helps me understand each step before closing?\nInvitation: Book a buyer consultation to walk through the process.\n\nNo local demand, search volume, or results have been verified.", "research": "PREPARED EXAMPLE. No observed research supplied. All topics remain unvalidated.\n\n1. What should I do before touring my first home?\nConcern: I do not know where to begin.\nEvidence: None supplied. Unvalidated.\nFormat: Both. A short checklist can expand into a process explanation.\nConsultation connection: Plan the buyer’s first steps.\nJudgment: Best classroom starting point because it is clear and useful.\n\n2. What should I ask during a home tour?\nConcern: I may overlook something important.\nEvidence: None supplied. Unvalidated.\nFormat: Short video, with a longer walkthrough if useful.\nConsultation connection: Build a touring checklist together.\nJudgment: Narrow enough for a complete short answer.\n\n3. What costs should I ask about beyond the down payment?\nConcern: I may miss costs when planning.\nEvidence: None supplied. Unvalidated.\nFormat: Both, after checking any financial details.\nConsultation connection: Prepare questions for the appropriate professionals.\nJudgment: Useful, but factual details need more review.\n\nNext research action: Ask the room which question they actually heard recently. Record the anonymous question, source type, and date. Replace “None supplied” only when an observation exists.", "script": "PREPARED EXAMPLE. Spoken script. Read aloud and time before recording.\n\nBefore you spend Saturday touring homes, I’d get clear on three things.\n\nFirst, what monthly housing payment actually feels comfortable for you? Think about your whole budget, including room for repairs and the life you want to live.\n\nSecond, talk with a mortgage professional about your financing and what documents they need.\n\nThird, separate your must haves from your nice to haves.\n\nA shorter commute might be essential. The perfect kitchen backsplash probably isn’t.\n\nWhen we get clear on those things first, I can help you focus your search.\n\nIf you’re buying your first home and don’t know where to start, message me and we’ll map out your first steps.\n\nFILMING NOTES\nLook at the lens. Pause between the three steps. Use simple on screen labels: Budget, Financing, Priorities. Use a hypothetical written checklist with no client details. The 45 to 60 second target is a classroom format, not a platform rule.", "revise": "PREPARED EXAMPLE. Revised spoken script.\n\nBefore we tour your first home, I’d talk through three things with you.\n\nWhat monthly housing payment feels comfortable? Leave room in your budget for repairs and everyday life.\n\nNext, talk with a mortgage professional about financing and the documents they need from you.\n\nThen write down your must haves and your preferences. A shorter commute might be essential. A perfect kitchen backsplash might be a preference.\n\nThat gives us a clearer starting point for your search.\n\nMessage me and we’ll plan your first steps together.", "youtube": "PREPARED EXAMPLE. A proposed six minute video, not a platform length requirement.\n\nTITLE OPTIONS\n1. Buying Your First Home? Start With These 3 Steps\n2. What to Do Before Touring Your First Home\n3. First Home Checklist: Budget, Financing, Priorities\n\nOPENING, 0:00 to 0:20\nBefore you start booking home tours, let’s talk through three things that can make your search more focused: a housing budget you feel comfortable with, a financing conversation, and a clear list of priorities. I’ll show you an example of each.\n\nOUTLINE\n0:20 to 1:50. A payment that fits your life.\nExplain how to prepare your own budget questions. Hypothetical example: a buyer wants room for repairs and the activities they value. Use no invented dollar amounts or affordability formulas.\n\n1:50 to 3:20. Prepare for a financing conversation.\nAsk the mortgage professional what information and documents they need for your situation. Hypothetical example: a buyer writes down questions before the call instead of assuming a document checklist applies to everyone.\n\n3:20 to 5:20. A focused home search.\nExplain must haves and preferences. Hypothetical example: a shorter commute is essential, while a backsplash can be a preference. Show a simple blank checklist.\n\n5:20 to 6:00. Recap and next step.\nRestate the three steps. Invite the viewer to book a buyer consultation to plan their first steps.\n\nTHUMBNAIL\nText: BEFORE YOU TOUR\nVisual concept: your own photo beside a three item checklist. Budget. Financing. Priorities. Use only a photo you have permission to use.\n\nVERIFY BEFORE RECORDING\nConfirm any financing details you add with the mortgage professional. Check any local process claims before including them. This outline supplies no rates, qualification rules, or local statistics.", "week": "PREPARED EXAMPLE. Proposed plan. Nothing has been reviewed, recorded, scheduled, or published.\n\nMONDAY. Short video: What housing payment feels comfortable?\nHook: Before you start browsing homes, what payment fits your life?\nTakeaway: Prepare your own budget questions and leave room for everyday life.\nInvitation: Message me to plan your first steps.\nRecord: Direct to camera with a blank budget questions card.\nVerify: Any costs or financial figures you choose to add.\n\nWEDNESDAY. Short video: What should I ask before my financing conversation?\nHook: Before your financing call, write down your questions.\nTakeaway: Ask the mortgage professional which information and documents they need for your situation.\nInvitation: Let’s plan the questions for your next conversation.\nRecord: Direct to camera and an anonymous questions checklist.\nVerify: Any specific document or qualification requirements with a mortgage professional.\n\nFRIDAY. Short video: Which home features matter most?\nHook: Is that feature a must have or a preference?\nTakeaway: Separate essentials from preferences using the hypothetical commute and backsplash example.\nInvitation: Message me to build your home search checklist.\nRecord: A narrated two column checklist or direct to camera.\nVerify: No added factual claims in this example. Review any new claims.\n\nSUNDAY. Longer YouTube video: Buying Your First Home? Start With These 3 Steps\nHook: Before you book tours, let’s plan your first steps.\nTakeaway: Connect budget, financing, and priorities with examples.\nInvitation: Book a buyer consultation.\nRecord: A six minute explanation using the approved outline and checklist.\nVerify: All added financing and local process details.\n\nPRODUCTION\nUse one planning session and one recording session. Reserve time to edit and review. If four videos do not fit, begin with one reviewed short this week and build the longer video next week.\n\nTRACKING TABLE FIELDS\nTopic / Draft status / Review status / Recording status / Publish date / Video link / Seven day results / Next improvement\nInitial state for every item: Idea only, not drafted, not reviewed, not recorded, no actual publish date, no link, no results, improvement to choose after review.\n\nWORKFLOW\nIdea, draft, human review, record, publish, review results."}};
const {slides,prompts,results}=DATA;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current=0,returnFocus=null;
$('deck').innerHTML=slides.map((s,i)=>`<section class="slide ${s.kind}" aria-labelledby="title-${i}" data-slide="${i}"><div class="slide-top"><span>${s.section}</span><span>THE LEGENDS MORTGAGE TEAM</span></div><h2 id="title-${i}">${s.title}</h2><div class="content">${s.body}${s.demo?`<div class="demo-actions"><button class="primary" data-prompt="${s.demo}">Open full prompt</button><button data-result="${s.demo}">Prepared example</button></div>`:''}</div><span class="slide-folio">RCRE / ${String(i+1).padStart(2,'0')}</span></section>`).join('');
function go(i){current=Math.max(0,Math.min(slides.length-1,i));document.querySelectorAll('.slide').forEach((s,n)=>{s.classList.toggle('active',n===current);s.setAttribute('aria-hidden',String(n!==current));});$('counter').textContent=`${current+1} / ${slides.length}`;$('progress').max=slides.length;$('progress').value=current;$('progress').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1;history.replaceState(null,'',`#slide-${current+1}`);$('announce').textContent=`Slide ${current+1}: ${slides[current].title.replace(/&amp;/g,'&')}`;window.scrollTo(0,0)}
function openPanel(title,body){returnFocus=document.activeElement;$('panel-title').textContent=title;$('panel-body').innerHTML=body;$('panel-body').scrollTop=0;$('panel').showModal();$('close').focus()}
$('close').onclick=()=>$('panel').close();$('panel').addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus()});
function promptPanel(key){openPanel('Full demo prompt',`<p>Edit bracketed context in your AI chat before running.</p><button class="primary" id="copy">Copy prompt</button><p class="status" id="copy-status" role="status" aria-live="polite"></p><pre id="prompt-text">${esc(prompts[key])}</pre><div id="manual"></div>`);$('copy').onclick=async()=>{$('copy-status').textContent='Copying prompt…';try{if(!navigator.clipboard?.writeText)throw Error('unavailable');await Promise.race([navigator.clipboard.writeText(prompts[key]),new Promise((_,reject)=>setTimeout(()=>reject(Error("clipboard timeout")),1800))]);$('copy-status').textContent='Prompt copied.'}catch(e){$('copy-status').textContent='Clipboard unavailable. Select and copy the prompt below.';$('manual').innerHTML='<label for="manual-copy">Prompt text for manual copying</label><textarea id="manual-copy" readonly></textarea><p>Press Command+C on Mac or Ctrl+C on Windows. You can also use your browser’s Copy command.</p>';$('manual-copy').value=prompts[key];$('manual-copy').focus();$('manual-copy').select();$('manual-copy').scrollIntoView({block:'nearest'});}}}
const resources=[['TikTok Creator Search Insights','https://newsroom.tiktok.com/creator-search-insights?lang=en'],['TikTok help guide','https://support.tiktok.com/en/using-tiktok/growing-your-audience/creator-search-insights'],['YouTube titles and thumbnails','https://support.google.com/youtube/answer/12340300?hl=en'],['YouTube audience retention','https://support.google.com/youtube/answer/9314415?hl=en'],['YouTube discovery guidance','https://support.google.com/youtube/answer/141805?hl=en']];
function links(list){return list.map(([name,url])=>`<p><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(name)}</a></p>`).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.prompt)promptPanel(b.dataset.prompt);if(b.dataset.result)openPanel('Prepared example',`<pre>${esc(results[b.dataset.result])}</pre>`);if(b.hasAttribute('data-resources'))openPanel('Official resources',`<p>Platform resources checked September 9, 2026. Links need internet. The deck, prompts, notes, and prepared examples work offline.</p>${links(resources)}`)});
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);
$('overview').onclick=()=>{openPanel('Slide overview',`<div class="overview-grid">${slides.map((s,i)=>`<button data-jump="${i}" aria-current="${i===current}"><span>${String(i+1).padStart(2,'0')}</span>${s.title}</button>`).join('')}</div>`);document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{$('panel').close();go(Number(b.dataset.jump))})};
$('notes').onclick=()=>{const s=slides[current];openPanel(`Presenter notes / Slide ${current+1}`,`<p class="note-warning">These notes are visible to everyone while you share this window or screen. Close them before returning to the audience view.</p><h3>Time</h3><p>${esc(s.time)}</p><h3>What to say</h3><p>${esc(s.say)}</p><h3>Key teaching point</h3><p>${esc(s.key)}</p>${s.question?`<h3>Audience question</h3><p>${esc(s.question)}</p>`:''}${s.steps?`<h3>Demonstration steps</h3><p>${esc(s.steps)}</p><p>If the tool takes more than a minute to load, use the prepared example and continue.</p>`:''}<h3>Transition</h3><p>${esc(s.transition)}</p>${s.refs.length?'<h3>Official resources</h3>'+links(s.refs):''}`)};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else throw Error()}catch(e){openPanel('Fullscreen unavailable','<p>Use your browser’s full screen command, or enlarge the window. All presentation controls still work.</p>')}};document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'Exit fullscreen':'Fullscreen'});
$('print').onclick=()=>window.print();
document.addEventListener('keydown',e=>{if($('panel').open||e.defaultPrevented||e.altKey||e.metaKey||e.ctrlKey||e.shiftKey||e.target.closest('button,a,input,textarea,select,[contenteditable="true"]')||window.getSelection()?.toString())return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}});
const initial=location.hash.match(/^#slide-(\d+)$/);go(initial?Number(initial[1])-1:0);
</script></body></html>
