[build]
  base = "apps/rcre-demo"
  command = "npm run build"
  publish = ".next"

[build.environment]
  # node:sqlite requires Node 22.5+. Netlify defaults to Node 20.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Skip the "cwd's parent's basename must equal RCRE" check. The Netlify
  # build runs inside apps/rcre-demo/ where the workspace boundary does not
  # apply. store.ts then resolves /tmp/rcre-runtime as the storage root.
  RCRE_DEPLOY_BYPASS_BOUNDARY = "1"
  # Enable the synthetic persona login on production builds. Without this,
  # demoEnabled() returns false and Taquilla cannot sign in.
  RCRE_DEMO_ENABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
